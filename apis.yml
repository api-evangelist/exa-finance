aid: exa-finance
name: Exa Finance
description: 'EXA Finance is a French Web3 company, founded in 2021, that builds EXA
  Market — a peer-to-peer NFT and multi-asset marketplace on the Algorand blockchain.
  Because Algorand represents both fungible tokens and NFTs under the single ASA (Algorand
  Standard Asset) standard, the EXA Market protocol lets users bundle up to four assets
  into a "basket" and trade them in a single transaction, sell NFTs for any ASA rather
  than only the native ALGO token, make peer-to-peer offers, and run standard sales,
  normal and Dutch/reverse auctions, and multi-mints. Creators set an on-chain royalty
  fee of up to 15% globally against their creator address, payable in ALGO, USDC,
  USDT and other opted-in assets. The protocol is governed by the EXA token (ASA ID
  1888888888) through the EXA Community DAO, whose EXRC/EXIP proposal lifecycle is
  modeled on Uniswap, dYdX, Tinyman and Blur. EXA raised a $2M seed round in January
  2022 with Speedinvest, Lemniscap, Big Brain Holdings, Borderless Capital, Encode
  Club, Meld Ventures, 11-11 DG Partners and 0x Ventures. EXA Market publishes no
  public HTTP/REST API: its programmable surface is on-chain Algorand smart contracts
  (listing, offer and auction contracts, published as TEAL approval programs), reached
  through standard Algorand algod and indexer node APIs and the Algorand SDKs.'
